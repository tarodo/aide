kind:
  code: rdbms
  name: Relational Database
flavor:
  code: postgres14
  name: PostgreSQL
  vendor: PostgreSQL Global Development Group
  versions: ["14"]
types:
  - code: smallint
    params_schema: {}
    render_template: smallint
  - code: integer
    params_schema: {}
    render_template: integer
  - code: bigint
    params_schema: {}
    render_template: bigint
  - code: decimal
    params_schema:
      precision: {type: int, required: false, default: null, min: 1, max: 1000}
      scale:     {type: int, required: false, default: null, min: -1000, max: 1000}
    render_template: "decimal({precision},{scale})"
  - code: numeric
    params_schema:
      precision: {type: int, required: false, default: null, min: 1, max: 1000}
      scale:     {type: int, required: false, default: null, min: -1000, max: 1000}
    render_template: "numeric({precision},{scale})"
  - code: real
    params_schema: {}
    render_template: real
  - code: double
    params_schema: {}
    render_template: double precision
  - code: smallserial
    params_schema: {}
    render_template: smallserial
  - code: serial
    params_schema: {}
