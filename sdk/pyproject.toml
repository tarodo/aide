[project]
name = "aide-sdk"
version = "0.1.0"
description = "Python SDK for AIDE metastore REST API"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "aide-schemas",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv.sources]
aide-schemas = { path = "../schemas", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
