services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
    env_file:
      - ./backend.env
    volumes:
      - venv_cache:/app/.venv
      - ./backend:/app/backend
    develop:
      watch:
        - path: .
          action: sync
          target: /app
    depends_on:
      - db

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    env_file:
      - ./db.env
    volumes:
      - db_data:/var/lib/postgresql/data

  db-test:
    image: postgres:17
    ports:
      - "5433:5432"
    env_file:
      - ./db.env
    environment:
      - POSTGRES_DB=aide_test
    volumes:
      - db_test_data:/var/lib/postgresql/data

  test:
    profiles:
      - test
    build:
      context: .
      target: dev
    environment:
      - DATABASE_URL=postgresql+asyncpg://aide:aide@db-test:5432/aide_test
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./schemas:/app/schemas
    depends_on:
      - db-test

volumes:
  venv_cache:
  db_data:
  db_test_data: