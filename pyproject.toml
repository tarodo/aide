[project]
name = "AIDE"
version = "0.1.0"
description = "AIDE Data Contract Service Ingestion Level"
readme = "README.md"
requires-python = ">=3.13.9"
dependencies = [
    "alembic>=1.17.1",
    "fastapi[standard]>=0.120.4",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.44",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.14.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
