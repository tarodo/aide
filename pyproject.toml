[project]
name = "AIDE"
version = "0.1.0"
description = "AIDE Data Contract Service Ingestion Level"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aide-schemas",
    "alembic>=1.17.1",
    "asyncpg>=0.29.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.120.4",
    "psycopg>=3.1.18",
    "psycopg-binary>=3.2.12",
    "pydantic-settings>=2.11.0",
    "python-jose[cryptography]>=3.5.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.44",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.14.3",
    "httpx>=0.27.0",
    "pytest-cov>=7.0.0",
    "types-python-jose>=3.3.4",
]

[tool.mypy]
exclude = ["tests/"]

[tool.black]
target-version = ["py313"]

[tool.uv.sources]
aide-schemas = { path = "schemas", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:transaction already deassociated",
]
